plugins { id 'com.android.application' }

android { namespace 'com.example.ollvmlab'; compileSdk 35
    defaultConfig { applicationId 'com.example.ollvmlab'; minSdk 26; targetSdk 35; versionCode 1; versionName '1.0' }
    buildTypes {
        debug { debuggable true; jniDebuggable true; minifyEnabled false }
        release { debuggable false; minifyEnabled false; proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro' }
    }
    externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' } }
    ndkVersion '27.3.13750724'
}
